name: Actualizar datos de la ruleta

on:
  schedule:
    - cron: '0 6 * * 1'   # todos los lunes a las 03:00 de Argentina
  workflow_dispatch:       # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerar index.html con listas frescas
        run: python actualizar.py
      - name: Guardar cambios
        run: |
          if git diff --quiet -- index.html; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Actualización semanal de datos"
          git push
